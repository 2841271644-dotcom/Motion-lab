name: 部署动效工坊到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取网站代码
        uses: actions/checkout@v6

      - name: 准备并检查静态文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html motion-lab.js _site/
          cp -R vendor _site/vendor
          cp -R svga-compress _site/svga-compress
          test -s _site/svga-compress/index.html
          test -s _site/svga-compress/core.mjs
          test -s _site/svga-compress/app.mjs
          test -s _site/svga-compress/style.css
          touch _site/.nojekyll
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          test -s _site/index.html
          test -s _site/motion-lab.js
          test -s _site/vendor/ffmpeg/index.js
          test -s _site/vendor/ffmpeg/worker.js
          test -s _site/vendor/core/ffmpeg-core.js
          test -s _site/vendor/core/ffmpeg-core.wasm
          test -s _site/vendor/jszip.min.js
          test -s _site/vendor/jszip-utils.min.js
          test -s _site/vendor/svga.min.js
          test -s _site/vendor/lottie.min.js
          test -s _site/vendor/pako.min.js
          test -s _site/vendor/protobuf.min.js

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站静态文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
